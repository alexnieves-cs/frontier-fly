    <script>
      // The indoor sim used to live here. Forward its old URLs (README links, shared shots) to sim.html.
      (function () {
        var keys = ['seed', 'shot', 'camera', 'stage', 'train', 'quality', 'pilot', 'tod', 'flash', 'lights', 'sensor', 'renderer'];
        var q = new URLSearchParams(location.search);
        if (keys.some(function (k) { return q.has(k); })) location.replace('sim.html' + location.search + location.hash);
      })();
    </script>
