name: release

# Attaches the tech report PDF to every published release. Zenodo archives each release of this
# repository and gives it a DOI.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: npx playwright install --with-deps chromium
      - run: npm run report:pdf -- frontier-fly-report.pdf
      - run: gh release upload "$TAG" frontier-fly-report.pdf --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
