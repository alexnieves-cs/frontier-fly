name: release

# Attaches the tech report PDF to every published release. Zenodo archives each release of this
# repository and gives it a DOI.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: npx playwright install --with-deps chromium
      - run: npm run report:pdf -- frontier-fly-report.pdf
      - run: gh release upload "$TAG" frontier-fly-report.pdf --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
