name: pypi

# Builds the frontierfly Python package (python/) with its bundled simulator and tests the wheel as a
# user would install it. Publishing (trusted publishing, no API token in the repository) runs on a
# published GitHub release, or by hand with `publish` set, and only once the repository variable
# PYPI_PUBLISHING is "true". Until then the publish step is skipped and the run stays green.
#
# One-time setup by the account owner, then set PYPI_PUBLISHING=true (Settings, Secrets and
# variables, Actions, Variables): add a trusted publisher on pypi.org for project "frontierfly",
# owner alexnieves-cs, repository frontier-fly, workflow pypi.yml, environment "pypi" (and on
# test.pypi.org with environment "testpypi" to rehearse). See docs/RELEASING.md.
on:
  pull_request:
    paths:
      - python/**
      - scripts/py/**
      - .github/workflows/pypi.yml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload after the build and tests pass (needs the PYPI_PUBLISHING variable)
        type: choice
        options: [none, testpypi, pypi]
        default: none

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run build:py
      - run: python -m pip install build twine
      - run: python -m build python --outdir dist-py
      - run: python -m twine check --strict dist-py/*
      # A wheel without the simulator would install and then fail on first use.
      - name: The wheel carries the simulator
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist-py/*.whl")[0]).namelist()
          for need in ["frontierfly/_server/server.mjs", "frontierfly/_server/assets/checkpoints/policy.bin", "frontierfly/_server/assets/plans/swiss-dwellings.json"]:
              assert need in names, f"{need} missing from the wheel"
          print("\n".join(names))
          PY
      - name: Test the installed wheel
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install "$(ls dist-py/*.whl)[test]"
          cd /tmp && /tmp/wheel-env/bin/python -m pytest "$GITHUB_WORKSPACE/python/tests" -q -p no:cacheprovider
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist-py/

  # Explains, on the run page, why nothing was uploaded when a publish was asked for before the
  # trusted publisher is set up. Succeeds, so the run is not red.
  publish-not-configured:
    needs: build
    if: vars.PYPI_PUBLISHING != 'true' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish != 'none'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          msg="PyPI publishing is not configured yet: add the trusted publisher (docs/RELEASING.md), then set the repository variable PYPI_PUBLISHING=true. The wheel was built and tested; nothing was uploaded."
          echo "::notice title=PyPI publish skipped::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build
    # A published, non-prerelease GitHub release uploads to PyPI; a dispatch from main uploads to the
    # index picked. A dispatch from another branch builds and tests but uploads nothing.
    if: >-
      vars.PYPI_PUBLISHING == 'true' && (
        (github.event_name == 'release' && !github.event.release.prerelease) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish != 'none' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || inputs.publish }}
      url: ${{ (github.event_name == 'release' || inputs.publish == 'pypi') && 'https://pypi.org/p/frontierfly' || 'https://test.pypi.org/p/frontierfly' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist-py/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist-py/
          repository-url: ${{ (github.event_name == 'release' || inputs.publish == 'pypi') && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
