name: train

# Runs PPO fine-tunes (scripts/train-ppo.ts) on GitHub's runners: one runner per line of `runs`,
# up to ~5.5 h each. An interactive cloud container is reclaimed when its session idles, so
# multi-hour training lives here, like the long studies in study.yml. Nothing lands on main: each
# run pushes its checkpoints (best + every validation point) and its log to
# train/<run id>-<k>, which a PR then picks from like a local run.
#
#   gh workflow run train -f runs='--updates 400 --seed 23
#   --updates 400 --seed 47 --crash-penalty -20'
#
# With script=train:indoor each line is one DAgger run (scripts/train-indoor.ts) instead, for the
# ablations in docs/REPORT.md. A line may start with ablation=<name> (src/sim/ablation.ts) to zero an
# observation block in training and evaluation. The runner then flies the arm's checkpoints on the
# coverage study's hard buildings (scripts/study/ablations.ts) and pushes the log and the flights;
# the checkpoints themselves are packed to .bin.
#
# With script=train:picker each line is one goal-picker search (scripts/train-picker.ts).
#
#   gh workflow run train -f script=train:picker -f runs='--mode cma --arm planner --seed 1|--mode cma --arm linear --seed 1'
#
#   gh workflow run train -f script=train:indoor -f runs='--ppo-updates 24|ablation=no-nav|ablation=no-local|ablation=no-coarse'
on:
  workflow_dispatch:
    inputs:
      runs:
        description: One train:ppo argument line per run (newline or '|' separated); each gets its own runner
        required: true
        default: '--updates 400'
      script:
        description: Trainer each line runs
        type: choice
        options: ['train:ppo', 'train:indoor', 'train:picker']
        default: 'train:ppo'
      ref_note:
        description: Free text recorded in each result commit (what this sweep is testing)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      runs: ${{ steps.plan.outputs.runs }}
    steps:
      - id: plan
        env:
          RUNS: ${{ inputs.runs }}
        run: |
          echo "runs=$(python3 -c 'import json,os,re; xs=[x.strip() for x in re.split(r"[\n|]", os.environ["RUNS"]) if x.strip()]; print(json.dumps(list(range(len(xs)))))')" >> "$GITHUB_OUTPUT"

  train:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        k: ${{ fromJSON(needs.plan.outputs.runs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The learner runs on tfjs-node when it is installed (scripts/lib/tfBackend.ts).
      - run: npm install --no-save @tensorflow/tfjs-node@4.22.0
      - name: Train
        timeout-minutes: 320
        env:
          RUNS: ${{ inputs.runs }}
          K: ${{ matrix.k }}
          SCRIPT: ${{ inputs.script }}
        run: |
          set -o pipefail
          line=$(python3 -c 'import os,re; xs=[x.strip() for x in re.split(r"[\n|]", os.environ["RUNS"]) if x.strip()]; print(xs[int(os.environ["K"])])')
          echo "args: $line"
          mkdir -p train-out
          echo "$SCRIPT $line" > train-out/args.txt
          if [ "$SCRIPT" = "train:indoor" ]; then
            # An optional leading ablation=<name> picks the observation ablation and names the arm.
            name=full
            if [[ "$line" =~ ^ablation=([a-z-]+)(\ |$)(.*)$ ]]; then
              name="${BASH_REMATCH[1]}"
              line="${BASH_REMATCH[3]}"
              export FRONTIER_OBS_ABLATION="$name"
            fi
            # shellcheck disable=SC2086
            npm run train:indoor -- --out "train-out/$name.json" $line 2>&1 | tee "train-out/$name.log"
            # Fly the arm's checkpoints on the coverage study's hard buildings (the script sets the ablation per arm).
            unset FRONTIER_OBS_ABLATION
            npx vite-node scripts/study/ablations.ts -- --runs train-out --out train-out/ablations.json
            # Keep the checkpoints that were flown, packed; the per-round JSON files are tens of MB.
            for f in "$name" "$name.r0" "$name.ppo"; do
              if [ -f "train-out/$f.json" ]; then npm run pack:checkpoint -- "train-out/$f.json" "train-out/$f.bin"; fi
            done
            rm -f train-out/*.r[0-9]*.json train-out/*.swa*.json "train-out/$name.json" "train-out/$name.ppo.json"
          elif [ "$SCRIPT" = "train:picker" ]; then
            # Goal-picker search on the quad (docs/QUAD_PICKER.md): log.jsonl and best.json per run.
            # shellcheck disable=SC2086
            npm run train:picker -- --out-dir train-out $line 2>&1 | tee train-out/train.log
          else
            # shellcheck disable=SC2086
            npm run train:ppo -- --out train-out/ppo.bin $line 2>&1 | tee train-out/train.log
          fi
      # Push even when the run hits the step timeout, so the checkpoints so far survive.
      - name: Push checkpoints to train/<run id>-<k>
        if: always()
        env:
          NOTE: ${{ inputs.ref_note }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898237+github-actions[bot]@users.noreply.github.com'
          b="train/${{ github.run_id }}-${{ matrix.k }}"
          git checkout -b "$b"
          git add -f train-out
          git commit -m "train:ppo run ${{ github.run_id }} #${{ matrix.k }}: $(cat train-out/args.txt) $NOTE"
          git push origin "$b"
