name: docker

# The headless CLI as a container image (Dockerfile), published to GitHub Container Registry as
# ghcr.io/alexnieves-cs/frontier-fly for linux/amd64 and linux/arm64.
#   push to main   -> :latest and :sha-<short>
#   tag v1.2.3     -> :1.2.3, :1.2
#   pull request   -> build and smoke-test only, nothing is pushed
# The Dockerfile's final stage has no RUN step, so the arm64 image builds without emulation.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - src/**
      - scripts/**
      - public/checkpoints/policy.bin
      - public/plans/**
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - src/**
      - scripts/**
      - public/checkpoints/policy.bin
      - public/plans/**
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Smoke test first, on this runner's platform: every command runs, and the image writes to /work.
      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: frontier-fly:smoke
          build-args: |
            VERSION=smoke
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run --rm frontier-fly:smoke --version
          docker run --rm frontier-fly:smoke list
          mkdir -p out && chmod 777 out
          docker run --rm -v "$PWD/out:/work" frontier-fly:smoke mission --scenario cabin-day --json mission.json --track track.csv | tee mission.txt
          grep -q 'Outcome: found (as expected)' mission.txt
          docker run --rm -v "$PWD/out:/work" frontier-fly:smoke bench --pilot guarded --tasks room,apartments --limit 2 --out bench.json
          docker run --rm -v "$PWD/out:/work" frontier-fly:smoke plan --seed 4242 --out woods.plan
          ls -la out
          test -s out/mission.json && test -s out/track.csv && test -s out/bench.json && test -s out/woods.plan
          # A usage error exits 2.
          set +e; docker run --rm frontier-fly:smoke mission --sed 1; code=$?; set -e
          test "$code" = 2
          docker image ls frontier-fly:smoke --format 'Image size: {{.Size}}' >> "$GITHUB_STEP_SUMMARY"

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: printf '### Published\n\n```\n%s\n```\n' "$TAGS" >> "$GITHUB_STEP_SUMMARY"
