name: ci

# Informational checks for pull requests and non-main branches.
# A failure here does not publish GitHub Pages and is not a merge gate.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Same-repo PR pushes already run via the push event. Fork PRs have no push on this repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Generated docs (README tables, BENCHMARKS.md, REPORT.md) must match the committed JSON.
      - run: npm run docs:check

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install-deps chromium
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npm run test:e2e
      # Serve dist/ with no COOP/COEP headers, as GitHub Pages does, and load every page.
      - run: npm run check:pages

  # FrontierBench entries: re-score every submitted pilot from its code (scripts/bench/verify.ts).
  # Runs for fork pull requests too: it needs no secrets, and the token here is read-only.
  bench-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then base=$(git rev-parse HEAD~1); fi
          # Entry folders that still exist, with plain names only (letters, digits, - and _).
          dirs=$(git diff --name-only "$base" HEAD -- bench/entries | cut -d/ -f1-3 | sort -u | { grep -E '^bench/entries/[A-Za-z0-9_-]+$' || true; } | while read -r d; do if [ -d "$d" ]; then echo "$d"; fi; done | tr '\n' ' ')
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.dirs != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.changed.outputs.dirs != ''
        run: npm ci
      - if: steps.changed.outputs.dirs != ''
        env:
          DIRS: ${{ steps.changed.outputs.dirs }}
        # DIRS holds only validated folder names; word splitting is intended.
        run: |
          npm run bench:verify -- $DIRS
          npm run bench:team -- --verify $DIRS
