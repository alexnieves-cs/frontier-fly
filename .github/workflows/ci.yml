name: ci

# Informational checks for pull requests.
# A failure here does not publish GitHub Pages and is not a merge gate.
# Runs on every pull request, including ones whose branch a workflow pushed (media/*, study/*,
# train/*): a push made with GITHUB_TOKEN starts no push run, so a push trigger would leave those
# pull requests with no checks at all. A branch with no pull request can be run from Run workflow.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # The same unit tests, instrumented (wall-clock budgets off); the summary goes on the run page.
  # Fails below the floor in vitest.config.ts (coverage.thresholds).
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`;
            console.log(["### Unit test coverage (src/)", "", "| | % | covered |", "|---|---|---|",
              ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

  # The Python package (python/): build the simulator bundle, install the package as a user
  # would (not editable), and run its tests, including bit-identical bench parity.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      - run: npm run build:py
      - run: pip install './python[test]'
      - run: python -m pytest python/tests -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Generated docs (README tables, BENCHMARKS.md, REPORT.md) must match the committed JSON.
      - run: npm run docs:check
      # The failure atlas page and docs/ATLAS.md are rendered from docs/atlas/*.json by their own script.
      - run: npx vite-node scripts/study/atlas-report.ts && git diff --exit-code docs/ATLAS.md docs/atlas.json
      # The PX4 results table in docs/PX4.md must match docs/px4-flight-check.json.
      - run: npx vite-node scripts/px4/report.ts -- --check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install-deps chromium
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npm run test:e2e
      # Serve dist/ with no COOP/COEP headers, as GitHub Pages does, and load every page.
      - run: npm run check:pages

  # FrontierBench entries: re-score every submitted pilot from its code (scripts/bench/verify.ts).
  # Runs for fork pull requests too: it needs no secrets, and the token here is read-only.
  bench-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then base=$(git rev-parse HEAD~1); fi
          # Entry folders that still exist, with plain names only (letters, digits, - and _).
          # A folder with any other name would skip the re-score below and still reach the leaderboard.
          bad=$(git diff --name-only --diff-filter=d "$base" HEAD -- bench/entries | cut -d/ -f1-3 | sort -u | { grep -vE '^bench/entries/[A-Za-z0-9_-]+$' || true; })
          if [ -n "$bad" ]; then echo "Entry folders may only use letters, digits, - and _: $bad"; exit 1; fi
          dirs=$(git diff --name-only "$base" HEAD -- bench/entries | cut -d/ -f1-3 | sort -u | { grep -E '^bench/entries/[A-Za-z0-9_-]+$' || true; } | while read -r d; do if [ -d "$d" ]; then echo "$d"; fi; done | tr '\n' ' ')
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.dirs != ''
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: steps.changed.outputs.dirs != ''
        run: npm ci
      - if: steps.changed.outputs.dirs != ''
        env:
          DIRS: ${{ steps.changed.outputs.dirs }}
        # DIRS holds only validated folder names; word splitting is intended.
        run: |
          npm run bench:verify -- $DIRS
          npm run bench:team -- --verify $DIRS
