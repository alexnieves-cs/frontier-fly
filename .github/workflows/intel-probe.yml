name: intel-probe
# Temporary: GitHub's runners can reach the Freiburg benchmark host, the dev
# container can't. Runs scripts/loc/fetch-intel.sh and commits the vendored
# copies (CC BY) to this branch, and prints the published result tables.
on:
  push:
    branches: [claude/project-thread-whem5k]
    paths: [.github/workflows/intel-probe.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/loc/fetch-intel.sh
      - name: check relation timestamps against the log
        run: |
          zcat data/intel-lab/intel.flaser.gz | awk '{print $(NF-2)}' > /tmp/ts
          awk '{print $1; print $2}' data/intel-lab/intel.relations | sort -u > /tmp/rt
          echo "relation stamps: $(wc -l < /tmp/rt), found exactly in log: $(grep -cxFf /tmp/rt /tmp/ts)"
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intel-lab
          git commit -m "Vendor the Intel Research Lab log and relations (CC BY), fetched by scripts/loc/fetch-intel.sh" || true
          git push
      - name: published tables
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          for u in https://www.diva-portal.org/smash/get/diva2:459937/FULLTEXT02.pdf https://research.google.com/pubs/archive/45466.pdf; do
            echo "=== $u"; curl -fsSL -A "Mozilla/5.0" -o p.pdf "$u" || continue
            pdftotext -layout p.pdf p.txt
            grep -n -i -B3 -A14 "intel" p.txt | head -220
          done
