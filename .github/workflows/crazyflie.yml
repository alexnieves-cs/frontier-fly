name: crazyflie

# The Crazyflie flight stack, in software: the safety guard's rules, the
# flight script flying the simulated Crazyflie through every ladder mode and
# injected fault, and the cflib link against a stand-in Crazyflie. No radio.
# Informational, like ci.yml.
on:
  # Pull requests only: see ci.yml for why there is no push trigger.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crazyflie-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flight-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r scripts/crazyflie/requirements.txt
      - run: npm run crazyflie:arena -- scripts/crazyflie/arenas/example-room.json
      - run: python -m pytest -v scripts/crazyflie/tests
