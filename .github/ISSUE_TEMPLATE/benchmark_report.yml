name: Benchmark result
description: Share numbers from `npm run bench` or the live page on your machine.
labels: [benchmark]
body:
  - type: input
    id: machine
    attributes:
      label: Machine
      placeholder: Ryzen 7 7840U, 8 cores, Radeon 780M, Chrome 130
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Paste docs/benchmarks.json, or the fps and steps/s the page showed.
      render: json
    validations:
      required: true
