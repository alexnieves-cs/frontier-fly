name: Feature request
description: Suggest a mission, sensor, environment, or training improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this let you do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would build it, and which part of src/ it touches.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This is for civilian search, inspection, or safety use. It does not add pursuit, targeting, or engagement.
          required: true
