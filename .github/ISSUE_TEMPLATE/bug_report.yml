name: Bug report
description: Something renders wrong, crashes, or behaves differently than documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page and URL
      description: The full URL, including the query string. A seed reproduces the same world.
      placeholder: https://alexnieves-cs.github.io/frontier-fly/sim.html?seed=11&camera=fpv
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the URL
        2. Press T to train
        3. ...
  - type: input
    id: browser
    attributes:
      label: Browser, OS, and GPU
      placeholder: Chrome 130, macOS 15, M2
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Errors from the browser console, if any.
      render: text
